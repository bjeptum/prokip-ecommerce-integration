<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Authentication Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-bottom: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .error {
            color: red;
            margin-top: 10px;
            padding: 10px;
            background-color: #ffebee;
            border-radius: 4px;
        }
        .success {
            color: green;
            margin-top: 10px;
            padding: 10px;
            background-color: #e8f5e8;
            border-radius: 4px;
        }
        .debug {
            margin-top: 20px;
            padding: 10px;
            background-color: #f0f0f0;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
        }
        .status {
            margin-top: 10px;
            padding: 10px;
            background-color: #e3f2fd;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h2>🔍 Final Authentication Test</h2>
    <p>This page tests authentication without any caching or middleware issues.</p>
    
    <div class="status" id="status">
        Checking test server...
    </div>
    
    <form id="loginForm">
        <div class="form-group">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" value="kenditrades" required>
        </div>
        
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
        </div>
        
        <button type="submit">Test with Test Server (Port 3001)</button>
        <button type="button" id="testMainServer">Test with Main Server (Port 3000)</button>
    </form>
    
    <div id="result"></div>
    <div id="debug"></div>
    
    <script>
        // Check test server status
        async function checkTestServerStatus() {
            const statusDiv = document.getElementById('status');
            
            try {
                const response = await fetch('http://localhost:3001/test-health');
                const data = await response.json();
                statusDiv.innerHTML = '✅ Test server running on port 3001: ' + JSON.stringify(data);
                statusDiv.style.backgroundColor = '#e8f5e8';
            } catch (error) {
                statusDiv.innerHTML = '❌ Test server error: ' + error.message;
                statusDiv.style.backgroundColor = '#ffebee';
            }
        }
        
        // Test with test server (no middleware)
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');
            const debugDiv = document.getElementById('debug');
            
            resultDiv.innerHTML = '';
            debugDiv.innerHTML = '';
            
            try {
                console.log('🧪 Testing with test server (port 3001)...');
                
                const response = await fetch('http://localhost:3001/test-auth', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });
                
                console.log('📡 Response status:', response.status);
                console.log('📡 Response status text:', response.statusText);
                
                const data = await response.json();
                console.log('📦 Response data:', data);
                
                if (response.ok) {
                    resultDiv.innerHTML = '<div class="success">✅ Test server authentication successful!</div>';
                    resultDiv.innerHTML += '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
                } else {
                    resultDiv.innerHTML = '<div class="error">❌ Test server authentication failed: ' + data.error + '</div>';
                    resultDiv.innerHTML += '<div class="error">Status: ' + response.status + ' ' + response.statusText + '</div>';
                }
                
                debugDiv.innerHTML = '<div class="debug"><strong>Test Server Debug Info:</strong><br>';
                debugDiv.innerHTML += 'Server: Port 3001 (no middleware)<br>';
                debugDiv.innerHTML += 'Status: ' + response.status + ' ' + response.statusText + '<br>';
                debugDiv.innerHTML += 'Response: ' + JSON.stringify(data, null, 2) + '</div>';
                
            } catch (error) {
                console.error('❌ Error:', error);
                resultDiv.innerHTML = '<div class="error">❌ Network error: ' + error.message + '</div>';
            }
        });
        
        // Test with main server (with middleware)
        document.getElementById('testMainServer').addEventListener('click', async function() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');
            const debugDiv = document.getElementById('debug');
            
            resultDiv.innerHTML = '';
            debugDiv.innerHTML = '';
            
            try {
                console.log('🧪 Testing with main server (port 3000)...');
                
                const response = await fetch('http://localhost:3000/auth/prokip-login', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });
                
                console.log('📡 Response status:', response.status);
                console.log('📡 Response status text:', response.statusText);
                
                const data = await response.json();
                console.log('📦 Response data:', data);
                
                if (response.ok) {
                    resultDiv.innerHTML = '<div class="success">✅ Main server authentication successful!</div>';
                    resultDiv.innerHTML += '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
                } else {
                    resultDiv.innerHTML = '<div class="error">❌ Main server authentication failed: ' + data.error + '</div>';
                    resultDiv.innerHTML += '<div class="error">Status: ' + response.status + ' ' + response.statusText + '</div>';
                }
                
                debugDiv.innerHTML = '<div class="debug"><strong>Main Server Debug Info:</strong><br>';
                debugDiv.innerHTML += 'Server: Port 3000 (with middleware)<br>';
                debugDiv.innerHTML += 'Status: ' + response.status + ' ' + response.statusText + '<br>';
                debugDiv.innerHTML += 'Response: ' + JSON.stringify(data, null, 2) + '</div>';
                
            } catch (error) {
                console.error('❌ Error:', error);
                resultDiv.innerHTML = '<div class="error">❌ Network error: ' + error.message + '</div>';
            }
        });
        
        // Check status on page load
        checkTestServerStatus();
    </script>
</body>
</html>
